### This config file contains required core defaults that must be set, along with a handful of common optional settings.
### For a full list of available settings, see https://microsoft.github.io/graphrag/config/yaml/

### LLM settings ###
## There are a number of settings to tune the threading and token limits for LLM calls - check the docs.

encoding_model: cl100k_base # this needs to be matched to your model!

llm:
  api_key: 'EMPTY' # set this in the generated .env file ecca2a4b76cf482fb321f9972ba6fd72
  type: openai_chat #openai_chat # or azure_openai_chat
  model: 'Llama-3.3-70B-Instruct'
  model_supports_json: false # recommended if this is available for your model.
  # audience: "https://cognitiveservices.azure.com/.default"
  api_base: 'http://10.209.76.161:8501/v1' #https://geely-05-chatgpt-001.openai.azure.com'
  # tokens_per_minute: 150
  # requests_per_minute: 10
  max_retries: 10
  max_retry_wait: 30
  # api_version: '2024-02-01'
  # organization: <organization_id>
  # deployment_name: gpt-4o

parallelization:
  stagger: 0.3
  num_threads: 5

async_mode: threaded # or asyncio

embeddings:
  async_mode: threaded # or asyncio
  vector_store:
    type: lancedb
    db_uri: 'output\lancedb'
    container_name: default
    overwrite: true
  llm:
    api_key: 'EMPTY'
    type: openai_embedding #openai_embedding # or azure_openai_embedding
    model: bcecontext
    api_base: 'http://10.209.76.161:8502/v1'
  # batch_max_tokens: 256000
  # batch_size: 1000
    # api_version: '2024-02-15-preview'
    # audience: "https://cognitiveservices.azure.com/.default"
    # organization: <organization_id>
    # deployment_name: text-embedding-ada-002

### Input settings ###

input:
  type: file # or blob
  file_type: text # or csv
  base_dir: "input"
  file_encoding: utf-8
  file_pattern: ".*\\.txt$"

chunks:
  group_by_columns: [id]
  strategy: 
    type: "sentence"

### Storage settings ###
## If blob storage is specified in the following four sections,
## connection_string and container_name must be provided

cache:
  type: file # or blob
  base_dir: "cache"

reporting:
  type: file # or console, blob
  base_dir: "logs"

storage:
  type: file # or blob
  base_dir: "output"

## only turn this on if running `graphrag index` with custom settings
## we normally use `graphrag update` with the defaults
update_index_storage:
  # type: file # or blob
  # base_dir: "update_output"

### Workflow settings ###

skip_workflows: [] #['create_base_text_units', 'create_final_documents', 'create_base_entity_graph', 'create_final_entities', 'create_final_nodes', 'create_final_communities', 'create_final_relationships', 'create_final_text_units', 'create_final_community_reports']

entity_extraction:
  prompt: "prompts/entity_extraction.txt"
  entity_types: [SEEKER EMOTION, SEEKER INTENTION, SUPPORTER EMOTION SUPPORT STRATEGY, SUPPORTER PRATICAL GUIDANCE, SUPPORTER LANGUAGE STYLE AND CHARACTERISTIC]
  max_gleanings: 1

summarize_descriptions:
  prompt: "prompts/summarize_descriptions.txt"
  max_length: 5000

claim_extraction:
  enabled: false
  prompt: "prompts/claim_extraction.txt"
  description: "Any claims or facts that could be relevant to information discovery."
  max_gleanings: 1

community_reports:
  prompt: "prompts/community_report.txt"
  max_length: 2000
  max_input_length: 8000

cluster_graph:
  max_cluster_size: 200

embed_graph:
  enabled: false # if true, will generate node2vec embeddings for nodes

umap:
  enabled: false # if true, will generate UMAP embeddings for nodes

snapshots:
  graphml: false
  raw_entities: false
  top_level_nodes: false
  embeddings: false
  transient: false

### Query settings ###
## The prompt locations are required here, but each search method has a number of optional knobs that can be tuned.
## See the config docs: https://microsoft.github.io/graphrag/config/yaml/#query

local_search:
  prompt: "prompts/local_search_system_prompt.txt"

global_search:
  map_prompt: "prompts/global_search_map_system_prompt.txt"
  reduce_prompt: "prompts/global_search_reduce_system_prompt.txt"
  knowledge_prompt: "prompts/global_search_knowledge_system_prompt.txt"

drift_search:
  prompt: "prompts/drift_search_system_prompt.txt"
